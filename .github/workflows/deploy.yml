name: Build, verify and deploy
on:
    push:
        branches: [master]
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Prepare environment
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - run: npm install --global pnpm@9.15.0
            - name: Install deps
              run: pnpm install --no-frozen-lockfile
            - name: Build plugin(s)
              run: node ./build.mjs
            # Distribution integrity (including that the published index.json and
            # 404 page name no unlisted plugin), every plugin verifier and the
            # typecheck. Nothing is published unless all of this passes.
            - name: Verify
              run: node ./scripts/verify-all.mjs

    deploy:
        needs: verify
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
            - uses: actions/checkout@v4
            - name: Prepare environment
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - run: npm install --global pnpm@9.15.0
            - name: Install deps
              run: pnpm install --no-frozen-lockfile
            - name: Build plugin(s)
              run: node ./build.mjs
            - name: Verify the exact build that is about to be published
              run: node ./scripts/verify-all.mjs
            # dist/404.md is written by build.mjs. The README is deliberately
            # NOT published: it lists every plugin in the repository.
            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
                  enable_jekyll: true
