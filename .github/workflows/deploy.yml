name: Build, verify and deploy
on:
    push:
        branches: [master]
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Prepare environment
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - run: npm install --global pnpm@9.15.0
            - name: Install deps
              run: pnpm install --no-frozen-lockfile
            - name: Build plugin(s)
              run: node ./build.mjs
            # Distribution integrity, every plugin verifier and the typecheck.
            # Nothing is published unless all of this passes.
            - name: Verify
              run: node ./scripts/verify-all.mjs

    deploy:
        needs: verify
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
            - uses: actions/checkout@v4
            - name: Prepare environment
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - run: npm install --global pnpm@9.15.0
            - name: Install deps
              run: pnpm install --no-frozen-lockfile
            - name: Build plugin(s)
              run: node ./build.mjs
            - name: Verify the exact build that is about to be published
              run: node ./scripts/verify-all.mjs
            - name: Copy additional files
              run: |
                  cp README.md dist/README.md
                  printf -- "---\npermalink: /404.html\n---\n" > dist/404.md
                  printf -- "> **Note:** You accessed a link that returned a 404, probably by clicking one of the plugin links. You're supposed to copy the link address and add it into Revenge.\n\n" >> dist/404.md
                  cat README.md >> dist/404.md
            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
                  enable_jekyll: true
